{% extends "base.html" %}
{% block title %}Categorías{% endblock %}
{% block page_title %}Categorías{% endblock %}

{% block content %}
<div style="display:grid;grid-template-columns:320px 1fr;gap:20px;">
  <div class="card">
    <div class="card-title">Nueva categoría</div>
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" required placeholder="Ej: Mujer, Rugby, Accesorios...">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Crear</button>
    </form>
  </div>
  <div class="card">
    <div class="card-title">Categorías existentes</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Nombre</th></tr></thead>
        <tbody>
          {% for c in categorias %}
          <tr><td class="text-muted">{{ c.id }}</td><td>{{ c.nombre }}</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
